[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skyrecover"
version = "0.1.0"
description = "Predicts airline delays, models how they ripple through the network, and (soon) re-plans operations when things break."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "requests>=2.31",
    "ortools>=9.10",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
app = ["streamlit>=1.40", "altair>=5.0", "pydeck>=0.8"]

[project.scripts]
skyrecover = "skyrecover.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
